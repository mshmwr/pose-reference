<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拍照姿勢資料庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: contact-sheet studio — filters on top, every pose is a numbered frame on the sheet; the light table (add poses) sits below. */
:root {
  --paper: #f6f4f8;
  --sheet: #ffffff;
  --ink: #221b29;
  --muted: #6d6476;
  --line: #ddd6e3;
  --accent: #7b2d8e;
  --accent-soft: #efe2f3;
  --frame: #f2b73a;       /* grease-pencil yellow for crop marks */
  --stage: #1d1822;
  --female: #c2416b;
  --male: #2f6db5;
  --display: "Dela Gothic One", "Zen Kaku Gothic New", system-ui, sans-serif;
  --body: "Zen Kaku Gothic New", "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #17131b; --sheet: #211b27; --ink: #efe9f3; --muted: #a79dae; --line: #3a3241;
    --accent: #c78bd8; --accent-soft: #33253b; --frame: #f2c45a; --stage: #0d0a10;
    --female: #f08aa9; --male: #7fb0ec; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #17131b; --sheet: #211b27; --ink: #efe9f3; --muted: #a79dae; --line: #3a3241;
  --accent: #c78bd8; --accent-soft: #33253b; --frame: #f2c45a; --stage: #0d0a10;
  --female: #f08aa9; --male: #7fb0ec; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; display: grid; gap: 28px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 6vw, 52px); line-height: 1.05; margin: 0; letter-spacing: .02em; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.lede { color: var(--muted); max-width: 62ch; margin: 8px 0 0; }
header { display: grid; gap: 6px; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }

.btn { font: 500 14px var(--body); border: 1px solid var(--line); background: var(--sheet); color: var(--ink); padding: 8px 14px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--frame); outline-offset: 2px; }
.btn[disabled] { opacity: .45; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* filters */
.filters { display: grid; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding-block: 10px; border-bottom: 1px solid var(--line); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--sheet); }
.seg button { font: 500 14px var(--body); border: 0; background: transparent; color: var(--ink); padding: 8px 16px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg .n { font: 400 12px var(--mono); opacity: .7; font-variant-numeric: tabular-nums; }
.chip { font: 500 13px var(--body); border: 1px solid var(--line); background: var(--sheet); color: var(--ink); padding: 4px 12px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.filters select { font: 500 14px var(--body); background: var(--sheet); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; max-width: 100%; }
.count { font: 500 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* contact sheet */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
.card canvas { width: 100%; aspect-ratio: 3 / 4; display: block; background: var(--stage); cursor: zoom-in; max-width: 100%; }
.card .meta { padding: 10px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.frame-no { font: 500 11px var(--mono); letter-spacing: .1em; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.card strong { font-weight: 500; font-size: 14px; line-height: 1.45; }
.card .src { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.g { font: 500 11px var(--body); padding: 0 6px; border-radius: 4px; border: 1px solid currentColor; letter-spacing: 0; }
.g.female { color: var(--female); }
.g.male { color: var(--male); }
.mine { font: 500 11px var(--body); background: var(--frame); color: #221b29; padding: 0 6px; border-radius: 4px; letter-spacing: 0; }
.empty { color: var(--muted); padding: 32px 16px; text-align: center; border: 1px dashed var(--line); border-radius: 8px; grid-column: 1 / -1; }

/* light table (add poses) */
.table { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 14px; }
.table-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: baseline; }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
#localSel, .field input, .field select, .plist input, .plist select { font: 500 14px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0; max-width: 100%; }
.drop { border: 2px dashed var(--line); border-radius: 8px; padding: 32px 16px; text-align: center; display: grid; gap: 8px; justify-items: center; color: var(--muted); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.stagebox { position: relative; user-select: none; touch-action: none; cursor: crosshair; line-height: 0; border-radius: 6px; overflow: hidden; background: var(--stage); }
.stagebox img { width: 100%; display: block; pointer-events: none; }
.box { position: absolute; border: 2px solid var(--frame); box-shadow: 0 0 0 1px rgba(0,0,0,.35); cursor: pointer; }
.box.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--frame); }
.box .tag { position: absolute; left: -2px; top: -2px; transform: translateY(-100%); background: var(--frame); color: #221b29; font: 500 11px/1 var(--mono); padding: 3px 5px; white-space: nowrap; }
.box .x { position: absolute; right: -2px; top: -2px; width: 22px; height: 22px; border: 0; background: var(--frame); color: #221b29; font: 700 14px/22px var(--body); cursor: pointer; padding: 0; }
.box.temp { border-style: dashed; pointer-events: none; }
.plist { display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto auto auto; gap: 8px; align-items: center; padding: 6px; border-radius: 6px; }
.prow.sel { background: var(--accent-soft); }
.prow .no { font: 500 12px var(--mono); color: var(--muted); }
.prow .del { border: 0; background: transparent; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px 8px; }
@media (max-width: 560px) { .prow { grid-template-columns: 2.4em minmax(0, 1fr) auto; } .prow select { grid-column: 2; } }
.export { font: 12px/1.5 var(--mono); width: 100%; min-height: 120px; background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }

/* practice overlay */
.practice { position: fixed; inset: 0; z-index: 10; background: var(--stage); color: #f3edf6; display: grid; grid-template-rows: auto 1fr auto; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); gap: 12px; }
.practice .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.practice .title { font-family: var(--display); font-size: clamp(20px, 4vw, 32px); line-height: 1.2; }
.practice .pcount { font: 500 13px var(--mono); color: #b9adc2; font-variant-numeric: tabular-nums; }
.practice canvas { width: 100%; height: 100%; min-height: 0; display: block; }
.practice canvas.mirror { transform: scaleX(-1); }
.practice .ctrl { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
.practice .btn { background: #2c2433; border-color: #4a3f53; color: #f3edf6; }
.practice .btn.on { background: var(--frame); border-color: var(--frame); color: #221b29; }
.practice select { font: 500 14px var(--body); background: #2c2433; color: #f3edf6; border: 1px solid #4a3f53; border-radius: 6px; padding: 8px; }
.progress { height: 4px; background: #3a3142; border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--frame); }
.big-count { position: absolute; inset: 0; display: grid; place-items: center; font: 400 min(40vw, 260px) var(--display); color: var(--frame); pointer-events: none; text-shadow: 0 4px 30px rgba(0,0,0,.5); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 6px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">Pose library · 男生 / 女生</span>
    <h1>拍照姿勢資料庫</h1>
    <p class="lede">從團體照裡一格一格裁出來的姿勢範本。先選男生或女生、再挑類型，點任何一張就能全螢幕照著擺，也可以設定自動換下一個。</p>
  </header>

  <section class="filters" aria-label="篩選">
    <div class="row">
      <div class="seg" role="group" aria-label="性別">
        <button type="button" data-g="all" aria-pressed="true">全部 <span class="n" id="n-all"></span></button>
        <button type="button" data-g="female" aria-pressed="false">女生 <span class="n" id="n-female"></span></button>
        <button type="button" data-g="male" aria-pressed="false">男生 <span class="n" id="n-male"></span></button>
      </div>
      <label for="srcFilter" class="hint">來源</label>
      <select id="srcFilter"><option value="">全部照片</option></select>
    </div>
    <div class="row" id="tagRow" role="group" aria-label="類型"></div>
    <div class="row" style="justify-content:space-between">
      <span class="count" id="count"></span>
      <div class="row">
        <button class="btn" id="shuffleBtn">隨機一個</button>
        <button class="btn primary" id="practiceBtn">開始練習</button>
      </div>
    </div>
  </section>

  <section aria-label="姿勢範本"><div id="grid" class="grid"></div></section>

  <section class="table" aria-label="新增範本" id="add">
    <div class="table-head">
      <div style="display:grid;gap:2px">
        <h2>新增範本</h2>
        <p class="hint">載入照片、框出每個人，馬上就會出現在上面的資料庫（只存在這個瀏覽器）。要永久收進資料庫，按「複製資料」把內容連同照片傳給 Claude。</p>
      </div>
      <div class="row">
        <label class="btn" for="file">載入照片</label>
        <input id="file" type="file" accept="image/*" hidden>
      </div>
    </div>
    <div class="row" id="localPicker" hidden>
      <label for="localSel" class="hint">編輯中的照片</label>
      <select id="localSel"></select>
    </div>
    <div id="drop" class="drop">
      <strong>把照片拖進來，或按「載入照片」，也可以直接貼上（Ctrl / ⌘ + V）</strong>
      <span class="hint">每框一個人就多一個範本，可以分別設定男生／女生和類型。</span>
    </div>
    <div id="editor" hidden style="display:grid;gap:14px">
      <div class="row" style="align-items:end">
        <label class="field" style="flex:1 1 220px">照片名稱<input id="photoTitle" placeholder="例：海邊畢業照"></label>
        <label class="field">新框的預設性別
          <select id="photoGender"><option value="female">女生</option><option value="male">男生</option></select>
        </label>
      </div>
      <div id="stage" class="stagebox"><img id="photo" alt="正在框選的照片"></div>
      <p class="hint">在照片上拖曳畫出方框，一人一格。點方框選取，按 × 刪除。</p>
      <div class="plist" id="plist"></div>
      <div class="row">
        <button class="btn" id="copyBtn">複製資料</button>
        <button class="btn" id="delPhoto">刪除這張照片</button>
      </div>
      <textarea id="exportBox" class="export" readonly hidden aria-label="匯出的資料"></textarea>
    </div>
  </section>
</div>

<div id="practice" class="practice" hidden role="dialog" aria-label="練習模式">
  <div class="top">
    <div>
      <div class="title" id="pTitle"></div>
      <div class="pcount" id="pCount"></div>
    </div>
    <button class="btn" id="pClose">關閉 (Esc)</button>
  </div>
  <div style="position:relative;min-height:0">
    <canvas id="pCanvas"></canvas>
    <div class="big-count" id="bigCount" hidden></div>
  </div>
  <div style="display:grid;gap:10px">
    <div class="progress"><i id="pBar"></i></div>
    <div class="ctrl">
      <button class="btn" id="pPrev">← 上一個</button>
      <button class="btn" id="pNext">下一個 →</button>
      <button class="btn" id="pRand">隨機</button>
      <button class="btn" id="pMirror" title="左右翻轉，像照鏡子一樣比較好模仿">鏡像</button>
      <label for="pInterval" class="pcount">自動換</label>
      <select id="pInterval">
        <option value="0">關閉</option>
        <option value="5">每 5 秒</option>
        <option value="8">每 8 秒</option>
        <option value="12">每 12 秒</option>
        <option value="20">每 20 秒</option>
      </select>
      <button class="btn" id="pCountdown">3 秒倒數</button>
    </div>
  </div>
</div>

<script>
(() => {
  const TAGS = ["動態", "站姿", "坐姿", "手勢", "互動"];
  const GENDER = { female: "女生", male: "男生" };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---------- data ----------
  // photos: id -> {id, title, w, h, src, local}; poses: [{id, photo, box:[x0,y0,x1,y1] px, name, gender, tags, local}]
  let shared = { photos: [], poses: [] };
  let local = { photos: [], poses: [] };      // photos here also carry .blob
  const images = new Map();                    // photo id -> Promise<HTMLImageElement>
  const urls = new Map();                      // local photo id -> blob url

  const allPhotos = () => [...shared.photos, ...local.photos.map((p) => ({ ...p, local: true }))];
  const allPoses = () => [...shared.poses, ...local.poses.map((p) => ({ ...p, local: true }))];
  const photoById = (id) => allPhotos().find((p) => p.id === id);

  function imageFor(photo) {
    if (!images.has(photo.id)) {
      const src = photo.local ? urls.get(photo.id) : photo.file;
      images.set(photo.id, new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }));
    }
    return images.get(photo.id);
  }

  // ---------- persistence ----------
  const LS = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
  let idb = null;
  function openDB() {
    return new Promise((res) => {
      try {
        const r = indexedDB.open("pose-library", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => { idb = r.result; res(); };
        r.onerror = () => res();
      } catch { res(); }
    });
  }
  function dbGet(k) {
    return new Promise((res) => {
      try { const t = idb.transaction("kv").objectStore("kv").get(k); t.onsuccess = () => res(t.result); t.onerror = () => res(null); }
      catch { res(null); }
    });
  }
  const saveLocal = () => { try { idb.transaction("kv", "readwrite").objectStore("kv").put(local, "local"); } catch {} };

  // ---------- filters ----------
  const F = Object.assign({ gender: "all", tag: "", src: "" }, LS.get("pose-filters", {}));
  function filtered() {
    return allPoses().filter((p) =>
      (F.gender === "all" || p.gender === F.gender) &&
      (!F.tag || (p.tags || []).includes(F.tag)) &&
      (!F.src || p.photo === F.src));
  }
  function renderFilters() {
    const poses = allPoses();
    $("n-all").textContent = poses.length;
    $("n-female").textContent = poses.filter((p) => p.gender === "female").length;
    $("n-male").textContent = poses.filter((p) => p.gender === "male").length;
    document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.g === F.gender)));
    const tr = $("tagRow"); tr.innerHTML = "";
    ["", ...TAGS].forEach((t) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = t || "全部類型";
      b.setAttribute("aria-pressed", String(F.tag === t));
      b.addEventListener("click", () => { F.tag = t; LS.set("pose-filters", F); renderAll(); });
      tr.appendChild(b);
    });
    const sel = $("srcFilter"), photos = allPhotos();
    if (F.src && !photos.some((p) => p.id === F.src)) F.src = "";
    sel.innerHTML = '<option value="">全部照片</option>' + photos.map((p) => `<option value="${esc(p.id)}">${esc(p.title || "未命名照片")}${p.local ? "（我的）" : ""}</option>`).join("");
    sel.value = F.src;
  }
  document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => { F.gender = b.dataset.g; LS.set("pose-filters", F); renderAll(); }));
  $("srcFilter").addEventListener("change", (e) => { F.src = e.target.value; LS.set("pose-filters", F); renderAll(); });

  // ---------- drawing a crop ----------
  async function drawPose(canvas, pose) {
    const photo = photoById(pose.photo); if (!photo) return;
    let im; try { im = await imageFor(photo); } catch { return; }
    const dpr = window.devicePixelRatio || 1, r = canvas.getBoundingClientRect();
    const W = Math.max(1, Math.round(r.width * dpr)), H = Math.max(1, Math.round(r.height * dpr));
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext("2d");
    const kx = im.naturalWidth / photo.w, ky = im.naturalHeight / photo.h;
    const [x0, y0, x1, y1] = pose.box, sw = (x1 - x0) * kx, sh = (y1 - y0) * ky;
    const k = Math.min(W / sw, H / sh), dw = sw * k, dh = sh * k;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(im, x0 * kx, y0 * ky, sw, sh, (W - dw) / 2, (H - dh) / 2, dw, dh);
  }

  // ---------- sheet ----------
  function renderGrid() {
    const list = filtered(), grid = $("grid");
    $("count").textContent = `${list.length} 個姿勢`;
    $("practiceBtn").disabled = $("shuffleBtn").disabled = !list.length;
    grid.innerHTML = "";
    if (!list.length) {
      const msg = F.gender === "male" && !allPoses().some((p) => p.gender === "male")
        ? "還沒有男生範本。到下面「新增範本」載入一張男生團體照，框出每個人就會出現在這裡。"
        : "沒有符合條件的姿勢，換個類型或來源試試。";
      grid.innerHTML = `<div class="empty">${msg}</div>`;
      return;
    }
    list.forEach((p, idx) => {
      const photo = photoById(p.photo);
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `<canvas aria-label="${esc(p.name)}"></canvas>
        <div class="meta">
          <span class="frame-no">FRAME ${String(idx + 1).padStart(2, "0")}
            <span class="g ${p.gender}">${GENDER[p.gender] || ""}</span>${p.local ? '<span class="mine">我的</span>' : ""}</span>
          <strong>${esc(p.name || "未命名姿勢")}</strong>
          <span class="src">${esc((p.tags || []).join("・"))}${p.tags?.length ? " · " : ""}${esc(photo?.title || "")}</span>
        </div>`;
      grid.appendChild(card);
      const cv = card.querySelector("canvas");
      cv.addEventListener("click", () => openPractice(idx));
      requestAnimationFrame(() => drawPose(cv, p));
    });
  }
  function renderAll() { renderFilters(); renderGrid(); }

  // ---------- editor (local poses) ----------
  let cur = null;        // current local photo id
  let selected = null;   // selected local pose id
  const curPhoto = () => local.photos.find((p) => p.id === cur);
  const curPoses = () => local.poses.filter((p) => p.photo === cur);
  const stage = $("stage");

  function renderEditor() {
    const ph = curPhoto();
    $("localPicker").hidden = !local.photos.length;
    $("localSel").innerHTML = local.photos.map((p) => `<option value="${esc(p.id)}">${esc(p.title || "未命名照片")}</option>`).join("") + '<option value="">＋ 再載入一張</option>';
    $("localSel").value = ph ? ph.id : "";
    $("editor").hidden = !ph; $("drop").hidden = !!ph;
    $("exportBox").hidden = true;
    if (!ph) return;
    if ($("photo").dataset.id !== ph.id) { $("photo").src = urls.get(ph.id); $("photo").dataset.id = ph.id; }
    $("photoTitle").value = ph.title || "";
    $("photoGender").value = ph.gender || "female";
    renderBoxes(); renderPlist();
  }
  function renderBoxes() {
    const ph = curPhoto(); stage.querySelectorAll(".box").forEach((n) => n.remove()); if (!ph) return;
    curPoses().forEach((p, i) => {
      const [x0, y0, x1, y1] = p.box, d = document.createElement("div");
      d.className = "box" + (p.id === selected ? " sel" : "");
      Object.assign(d.style, { left: x0 / ph.w * 100 + "%", top: y0 / ph.h * 100 + "%", width: (x1 - x0) / ph.w * 100 + "%", height: (y1 - y0) / ph.h * 100 + "%" });
      d.title = p.name || "";
      d.innerHTML = `<span class="tag">${String(i + 1).padStart(2, "0")}</span><button class="x" aria-label="刪除第 ${i + 1} 格">×</button>`;
      d.addEventListener("pointerdown", (e) => e.stopPropagation());
      d.addEventListener("click", (e) => {
        if (e.target.classList.contains("x")) removePose(p.id);
        else { selected = p.id; renderBoxes(); renderPlist(); $("name-" + p.id)?.focus(); }
      });
      stage.appendChild(d);
    });
  }
  function renderPlist() {
    const el = $("plist"); el.innerHTML = "";
    curPoses().forEach((p, i) => {
      const row = document.createElement("div");
      row.className = "prow" + (p.id === selected ? " sel" : "");
      row.innerHTML = `<span class="no">${String(i + 1).padStart(2, "0")}</span>
        <input id="name-${p.id}" placeholder="幫這個姿勢取名（例：雙手比愛心）" aria-label="第 ${i + 1} 格名稱">
        <select aria-label="性別"><option value="female">女生</option><option value="male">男生</option></select>
        <select aria-label="類型"><option value="">類型</option>${TAGS.map((t) => `<option>${t}</option>`).join("")}</select>
        <button class="del" aria-label="刪除第 ${i + 1} 格">×</button>`;
      const [inp, gSel, tSel] = row.querySelectorAll("input, select");
      inp.value = p.name || ""; gSel.value = p.gender; tSel.value = p.tags?.[0] || "";
      inp.addEventListener("input", () => { p.name = inp.value; saveLocal(); });
      inp.addEventListener("change", renderAll);
      inp.addEventListener("focus", () => { if (selected !== p.id) { selected = p.id; renderBoxes(); el.querySelectorAll(".prow").forEach((r) => r.classList.toggle("sel", r === row)); } });
      gSel.addEventListener("change", () => { p.gender = gSel.value; saveLocal(); renderAll(); });
      tSel.addEventListener("change", () => { p.tags = tSel.value ? [tSel.value] : []; saveLocal(); renderAll(); });
      row.querySelector(".del").addEventListener("click", () => removePose(p.id));
      el.appendChild(row);
    });
    if (!curPoses().length) el.innerHTML = '<p class="hint">還沒有框任何人。在照片上拖曳畫出第一個方框。</p>';
  }
  function removePose(id) {
    local.poses = local.poses.filter((p) => p.id !== id); if (selected === id) selected = null;
    saveLocal(); renderEditor(); renderAll();
  }
  $("photoTitle").addEventListener("input", (e) => { const ph = curPhoto(); if (ph) { ph.title = e.target.value; saveLocal(); } });
  $("photoTitle").addEventListener("change", renderAll);
  $("photoGender").addEventListener("change", (e) => { const ph = curPhoto(); if (ph) { ph.gender = e.target.value; saveLocal(); } });
  $("localSel").addEventListener("change", (e) => { cur = e.target.value || null; selected = null; renderEditor(); });

  // drag to draw a box
  let drag = null;
  const rel = (e) => { const r = stage.getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))]; };
  stage.addEventListener("pointerdown", (e) => {
    if (!curPhoto()) return;
    stage.setPointerCapture(e.pointerId);
    const [x, y] = rel(e), el = document.createElement("div"); el.className = "box temp"; stage.appendChild(el);
    drag = { x, y, el };
  });
  stage.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const [x, y] = rel(e);
    drag.r = { x: Math.min(x, drag.x), y: Math.min(y, drag.y), w: Math.abs(x - drag.x), h: Math.abs(y - drag.y) };
    Object.assign(drag.el.style, { left: drag.r.x * 100 + "%", top: drag.r.y * 100 + "%", width: drag.r.w * 100 + "%", height: drag.r.h * 100 + "%" });
  });
  const endDrag = () => {
    if (!drag) return;
    drag.el.remove(); const r = drag.r; drag = null;
    const ph = curPhoto(); if (!ph || !r || r.w < 0.015 || r.h < 0.02) return;
    const n = curPoses().length + 1;
    const pose = {
      id: `${ph.id}-${String(n).padStart(2, "0")}-${Math.random().toString(36).slice(2, 6)}`, photo: ph.id,
      box: [r.x * ph.w, r.y * ph.h, (r.x + r.w) * ph.w, (r.y + r.h) * ph.h].map(Math.round),
      name: "", gender: ph.gender || "female", tags: [],
    };
    local.poses.push(pose); selected = pose.id; saveLocal();
    renderBoxes(); renderPlist(); renderAll(); $("name-" + pose.id)?.focus();
  };
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);

  // loading a new photo
  function addPhoto(blob) {
    if (!blob || !/^image\//.test(blob.type)) { toast("這不是圖片檔，請換一張 JPG 或 PNG。"); return; }
    const url = URL.createObjectURL(blob), im = new Image();
    im.onload = () => {
      const id = "my-" + Date.now().toString(36);
      urls.set(id, url); images.set(id, Promise.resolve(im));
      const base = (blob.name || "").replace(/\.[^.]+$/, "");
      local.photos.push({ id, title: base || "我的照片", w: im.naturalWidth, h: im.naturalHeight, gender: "female", blob });
      cur = id; selected = null; saveLocal(); renderEditor(); renderAll();
      $("add").scrollIntoView({ behavior: "smooth", block: "start" });
    };
    im.onerror = () => toast("讀不到這張圖片，請換一個檔案試試。");
    im.src = url;
  }
  $("file").addEventListener("change", (e) => { const f = e.target.files[0]; if (f) addPhoto(f); e.target.value = ""; });
  const drop = $("drop");
  ["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => { const f = e.dataTransfer.files[0]; if (f) addPhoto(f); });
  document.addEventListener("paste", (e) => {
    if (e.target.matches?.("input, textarea")) return;
    const f = [...(e.clipboardData?.files || [])].find((x) => x.type.startsWith("image/"));
    if (f) addPhoto(f);
  });

  // export in the same shape as poses.json
  $("copyBtn").addEventListener("click", () => {
    const ph = curPhoto(); if (!ph) return;
    const slug = ph.id;
    const out = {
      photos: [{ id: slug, title: ph.title, file: `photos/${slug}.jpg`, w: ph.w, h: ph.h }],
      poses: curPoses().map((p, i) => ({ id: `${slug}-${String(i + 1).padStart(2, "0")}`, photo: slug, box: p.box, name: p.name, gender: p.gender, tags: p.tags })),
    };
    const text = JSON.stringify(out, null, 2), box = $("exportBox");
    box.value = text; box.hidden = false;
    const done = () => toast("已複製。把這段資料和照片一起傳給 Claude 就能收進資料庫");
    try { navigator.clipboard.writeText(text).then(done, () => { box.select(); toast("請手動複製下面的資料"); }); }
    catch { box.select(); toast("請手動複製下面的資料"); }
  });
  (function armed(btn, label, fn) {
    const orig = btn.textContent; let t;
    btn.addEventListener("click", () => {
      if (btn.dataset.armed) { clearTimeout(t); delete btn.dataset.armed; btn.textContent = orig; fn(); return; }
      btn.dataset.armed = "1"; btn.textContent = label;
      t = setTimeout(() => { delete btn.dataset.armed; btn.textContent = orig; }, 3000);
    });
  })($("delPhoto"), "再按一次確認刪除", () => {
    local.poses = local.poses.filter((p) => p.photo !== cur);
    local.photos = local.photos.filter((p) => p.id !== cur);
    images.delete(cur); cur = local.photos[0]?.id || null; selected = null;
    saveLocal(); renderEditor(); renderAll(); toast("已刪除這張照片和它的範本");
  });

  // ---------- practice ----------
  let pList = [], pIdx = 0, tStart = 0, raf = null, wake = null;
  const pc = $("pCanvas");
  function showP() {
    if (!pList.length) return;
    pIdx = (pIdx + pList.length) % pList.length;
    const p = pList[pIdx], photo = photoById(p.photo);
    $("pTitle").textContent = p.name || "未命名姿勢";
    $("pCount").textContent = `${pIdx + 1} / ${pList.length} · ${GENDER[p.gender] || ""}${p.tags?.length ? "・" + p.tags.join("・") : ""} · ${photo?.title || ""}`;
    drawPose(pc, p); tStart = performance.now();
  }
  function openPractice(i) {
    pList = filtered(); if (!pList.length) return;
    pIdx = i ?? 0; $("practice").hidden = false; document.body.style.overflow = "hidden";
    requestAnimationFrame(showP);
    try { navigator.wakeLock?.request("screen").then((w) => (wake = w)).catch(() => {}); } catch {}
    startAuto();
  }
  function closePractice() {
    $("practice").hidden = true; document.body.style.overflow = ""; stopAuto(); $("bigCount").hidden = true;
    try { wake?.release(); } catch {} wake = null;
  }
  const step = (d) => { pIdx += d; showP(); };
  function rand() { const n = pList.length; if (n < 2) return showP(); let k; do { k = Math.floor(Math.random() * n); } while (k === pIdx); pIdx = k; showP(); }
  function stopAuto() { cancelAnimationFrame(raf); raf = null; $("pBar").style.width = "0"; }
  function startAuto() {
    stopAuto(); const sec = +$("pInterval").value; if (!sec) return;
    tStart = performance.now();
    const tick = (now) => { const p = (now - tStart) / (sec * 1000); if (p >= 1) step(1); else $("pBar").style.width = p * 100 + "%"; raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
  }
  $("pInterval").addEventListener("change", startAuto);
  $("pPrev").addEventListener("click", () => step(-1));
  $("pNext").addEventListener("click", () => step(1));
  $("pRand").addEventListener("click", rand);
  $("pClose").addEventListener("click", closePractice);
  $("pMirror").addEventListener("click", (e) => { const on = pc.classList.toggle("mirror"); e.currentTarget.classList.toggle("on", on); });
  $("pCountdown").addEventListener("click", () => {
    const bc = $("bigCount"); let n = 3; bc.hidden = false; bc.textContent = n;
    const iv = setInterval(() => { n--; if (n > 0) bc.textContent = n; else { bc.textContent = "📸"; clearInterval(iv); setTimeout(() => (bc.hidden = true), 700); } }, 1000);
  });
  $("practiceBtn").addEventListener("click", () => openPractice(0));
  $("shuffleBtn").addEventListener("click", () => openPractice(Math.floor(Math.random() * filtered().length)));
  document.addEventListener("keydown", (e) => {
    if ($("practice").hidden) return;
    if (e.key === "Escape") closePractice();
    else if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); step(1); }
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key.toLowerCase() === "r") rand();
  });
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { renderGrid(); if (!$("practice").hidden) showP(); }, 150); });

  function toast(msg) {
    const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");
    document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
  }

  // ---------- boot ----------
  renderAll();
  Promise.all([
    fetch("poses.json").then((r) => (r.ok ? r.json() : null)).catch(() => null),
    openDB().then(() => dbGet("local")),
  ]).then(([data, saved]) => {
    if (data) shared = data;
    else $("grid").innerHTML = '<div class="empty">讀不到資料庫檔案 poses.json。用網址打開這個頁面（不是直接開本機檔案）就能看到所有範本。</div>';
    if (saved && saved.photos) {
      local = saved;
      local.photos.forEach((p) => urls.set(p.id, URL.createObjectURL(p.blob)));
      cur = local.photos[0]?.id || null;
    }
    renderEditor();
    if (data) renderAll(); else renderFilters();
  });
})();
</script>
</body>
</html>
